# ReleaseCore canonical Shopify application configuration.
# This file is intentionally production-safe; Shopify CLI rewrites callback URLs
# during local development because automatically_update_urls_on_dev is enabled.

client_id = "9eea48ea641cddd9fca95c0264a1499e"
name = "ReleaseCore"
application_url = "https://releasecore-web-production.up.railway.app"
embedded = true

[access_scopes]
# Only scopes used by current ReleaseCore features are declared.
scopes = "read_customers,read_products,write_products,read_publications,write_publications,read_files,write_files,write_metaobject_definitions,write_metaobjects,write_app_proxy"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [
  "https://releasecore-web-production.up.railway.app/api/auth"
]

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "/releasecore-proxy"
prefix = "apps"
subpath = "releasecore"
