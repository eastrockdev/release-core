# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9eea48ea641cddd9fca95c0264a1499e"
name = "ReleaseCore"
application_url = "https://releasecore-web-production.up.railway.app"
embedded = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# ReleaseCore currently needs:
# - Products: future release/product creation
# - Metaobjects: structured Shopify data
# - Files: artwork, split sheets, and supporting documents
scopes = "read_customers,read_products,write_products,read_files,write_files,write_metaobject_definitions,write_metaobjects,write_app_proxy"

[auth]
redirect_urls = [
  "https://releasecore-web-production.up.railway.app/api/auth"
]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

[app_proxy]
url = "/releasecore-proxy"
prefix = "apps"
subpath = "releasecore"