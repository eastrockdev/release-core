name: ReleaseCore quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check:graphql
      - run: npm run check:security
      - run: npm run check:tenancy
      - run: npm run check:compliance
      - run: npm run check:app-store
      - run: npm run check:architecture
      - run: npm run check:cleanup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
