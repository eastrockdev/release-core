name: ReleaseCore one-time readiness fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/releasecore-one-time-readiness-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch post-submission readiness behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          portal_path = Path("app/lib/portal.server.js")
          portal = portal_path.read_text()

          pattern = re.compile(
              r'  const datePolicy = releaseDatePolicy\(settings\);\s*'
              r'const releaseDate = releaseDateOnly\(release\.releaseDate\);\s*'
              r'const leadTimeCheck = validateReleaseDateLeadTime\(releaseDate, settings\);\s*'
              r'readiness\.checks\.releaseDateLeadTimeReady = !datePolicy\.enabled \|\| Boolean\(releaseDate && leadTimeCheck\.ok\);\s*'
              r'if \(releaseDate && !leadTimeCheck\.ok\) \{\s*'
              r'readiness\.ready = false;\s*'
              r'readiness\.blockers = \[\s*'
              r'\{ code: "RELEASE_LEAD_TIME", message: leadTimeCheck\.message \},\s*'
              r'\.\.\.readiness\.blockers\.filter\(\(item\) => item\.code !== "RELEASE_LEAD_TIME"\),\s*'
              r'\];\s*\}'
          )
          replacement = '''  const datePolicy = releaseDatePolicy(settings);
          const isInitialDraft = release.status === "DRAFT" && !release.submittedAt;
          const releaseDate = releaseDateOnly(release.releaseDate);
          const leadTimeCheck = validateReleaseDateLeadTime(releaseDate, settings);
          readiness.checks.releaseDateLeadTimeReady =
            !datePolicy.enabled ||
            !isInitialDraft ||
            Boolean(releaseDate && leadTimeCheck.ok);
          if (isInitialDraft && releaseDate && !leadTimeCheck.ok) {
            readiness.ready = false;
            readiness.blockers = [
              { code: "RELEASE_LEAD_TIME", message: leadTimeCheck.message },
              ...readiness.blockers.filter((item) => item.code !== "RELEASE_LEAD_TIME"),
            ];
          }'''
          portal, count = pattern.subn(replacement, portal, count=1)
          if count != 1:
              raise SystemExit("Could not patch portal release-date readiness logic")

          portal, count = re.subn(
              r'    releaseDatePolicy: datePolicy,',
              '    releaseDatePolicy: isInitialDraft\n      ? datePolicy\n      : { ...datePolicy, enabled: false },',
              portal,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not patch release-date policy visibility")

          portal, count = re.subn(
              r'  const leadTime = validateReleaseDateLeadTime\(releaseDateRaw \|\| null, settings\);\s*'
              r'if \(!leadTime\.ok\) throw publicError\(leadTime\.message\);',
              '''  if (release.status === "DRAFT" && !release.submittedAt) {
            const leadTime = validateReleaseDateLeadTime(releaseDateRaw || null, settings);
            if (!leadTime.ok) throw publicError(leadTime.message);
          }''',
              portal,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not patch draft-only release-date mutation validation")
          portal_path.write_text(portal)

          dashboard_path = Path("extensions/releasecore-artist-portal/assets/releasecore-dashboard.js")
          dashboard = dashboard_path.read_text()
          anchor = '      const splitSheet = fileByKind(release.files, "SPLIT_SHEET");'
          if anchor not in dashboard:
              raise SystemExit("Could not find release workspace file anchor")
          dashboard = dashboard.replace(
              anchor,
              anchor + '''
          const showReadiness =
            release.canSubmit &&
            String(release.distributionStatus || "").toUpperCase() !== "DELIVERED";''',
              1,
          )
          readiness_card = '              <article class="rc-native-side-card">${renderReadiness(release)}</article>'
          if readiness_card not in dashboard:
              raise SystemExit("Could not find readiness card")
          dashboard = dashboard.replace(
              readiness_card,
              '              ${showReadiness ? `<article class="rc-native-side-card">${renderReadiness(release)}</article>` : ""}',
              1,
          )
          dashboard_path.write_text(dashboard)

          Path(".github/workflows/releasecore-one-time-readiness-fix.yml").unlink()
          PY

      - name: Validate patched sources
        shell: bash
        run: |
          node --check app/lib/portal.server.js
          node --check extensions/releasecore-artist-portal/assets/releasecore-dashboard.js
          node scripts/validate-m18.2-native-portal.mjs
          node scripts/validate-release-timeline.mjs

      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name "East Rock Developer Team"
          git config user.email "87349597+eastrockdev@users.noreply.github.com"
          git add -A
          git commit -m "Fix post-submission release readiness prompts"
          git push origin HEAD:main
