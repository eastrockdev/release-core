# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "886119f2c8907b1f36c64dff6acb63bf"
application_url = "https://releasecore-er-production.up.railway.app"
embedded = true
name = "ReleaseCore — East Rock"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_files,read_metaobject_definitions,read_metaobjects,read_orders,read_products,read_publications,write_app_proxy,write_files,write_metaobject_definitions,write_metaobjects,write_products,write_publications,write_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[auth]
redirect_urls = [
  "https://releasecore-er-production.up.railway.app/api/auth"
]

[build]
automatically_update_urls_on_dev = false

[app_proxy]
url = "/releasecore-proxy"
prefix = "apps"
subpath = "releasecore"
